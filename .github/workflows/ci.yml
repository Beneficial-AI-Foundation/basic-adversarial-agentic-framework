name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: lake build prove scenarios
      # The scenarios use simulated assistants, so they need no API key. They
      # also check the accepted Lean code of the book.
      - name: Test
        run: lake test
